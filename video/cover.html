<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Red Pen cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Public+Sans:wght@500;600;700&family=Caveat:wght@700&display=swap">
<style>
  /* 600x800 cover: one big idea readable at thumbnail size. */
  html, body { margin: 0; width: 600px; height: 800px; overflow: hidden; }
  body {
    background: #eef3ee;
    background-image: repeating-linear-gradient(to bottom, transparent 0 39px, #d4e1d6 39px 40px);
    font-family: "Public Sans", system-ui, sans-serif; color: #15212a;
    display: grid; grid-template-rows: auto 1fr auto; padding: 56px 52px 48px; box-sizing: border-box;
  }
  .margin { position: absolute; top: 0; bottom: 0; left: 36px; width: 2px; background: rgba(200, 49, 43, .35); }
  .eyebrow { font-size: 15px; letter-spacing: .2em; text-transform: uppercase; font-weight: 600; color: #47575e; }
  h1 { margin: 26px 0 0; font-family: "Source Serif 4", Georgia, serif; font-weight: 700; font-size: 84px; line-height: 1.0; letter-spacing: -0.02em; }
  .circled { position: relative; color: #c8312b; white-space: nowrap; display: inline-block; }
  .circled svg { position: absolute; left: -7%; top: 4%; width: 114%; height: 100%; overflow: visible; }
  .rows { align-self: end; display: grid; gap: 0; margin-bottom: 34px; border-top: 3px solid #15212a; }
  .row { display: grid; grid-template-columns: 1fr auto 34px; gap: 12px; align-items: center; height: 46px; border-bottom: 1px solid #a9c2ae; font-size: 17px; }
  .row b { font-weight: 600; }
  .row span:nth-child(2) { font-variant-numeric: tabular-nums; font-weight: 700; }
  .row i { font: 700 30px/1 "Caveat", cursive; color: #c8312b; font-style: normal; text-align: center; }
  .row i.ok { color: #2f7d4a; font-size: 24px; }
  .row.hit { background: linear-gradient(90deg, rgba(200, 49, 43, .1), transparent 80%); }
  .sig { display: flex; gap: 16px; align-items: center; }
  .sig b { font-family: "Source Serif 4", Georgia, serif; font-size: 34px; display: block; line-height: 1; }
  .sig span { font-size: 15px; color: #47575e; }
</style>
</head>
<body>
  <div class="margin"></div>
  <div>
    <div class="eyebrow">Every transaction, read</div>
    <h1>1,885 checked.<br><span class="circled">20 need<br>a person.<svg viewBox="0 0 200 120" preserveAspectRatio="none" aria-hidden="true"><path id="loop" fill="none" stroke="#c8312b" stroke-width="4" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg></span></h1>
  </div>
  <div class="rows">
    <div class="row hit"><b>Same invoice paid twice</b><span>$4,644.96</span><i>⊘</i></div>
    <div class="row"><b>Monthly fuel card</b><span>$962.10</span><i class="ok">✓</i></div>
    <div class="row hit"><b>Split under approval limit</b><span>$14,815.00</span><i>⫶</i></div>
    <div class="row"><b>Library materials</b><span>$1,512.40</span><i class="ok">✓</i></div>
  </div>
  <div class="sig">
    <svg width="58" height="58" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="12" fill="#15212a"/><path d="M14 22h36M14 32h36M14 42h36" stroke="#a9c2ae" stroke-width="2"/><path d="M12 36c2-14 34-18 40-8 5 9-14 18-30 15-9-2-11-8-6-14" fill="none" stroke="#ff6a5c" stroke-width="3.5" stroke-linecap="round"/></svg>
    <div><b>Red Pen</b><span>Intelligent Municipal Finance · Iowa</span></div>
  </div>
  <script type="module">
    import { loopPath } from "../app/js/ui/pen.js";
    document.getElementById("loop").setAttribute("d", loopPath(200, 120, 20));
    window.coverReady = true;
  </script>
</body>
</html>
