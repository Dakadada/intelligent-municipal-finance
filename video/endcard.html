<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Red Pen · end card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Public+Sans:wght@400;600&family=Caveat:wght@700&display=swap">
<style>
  /* Closing card: the names and the app, required by the challenge rules. */
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: #eef3ee; color: #15212a; font-family: "Public Sans", system-ui, sans-serif;
    background-image: repeating-linear-gradient(to bottom, transparent 0 63px, #d4e1d6 63px 64px);
    display: grid; place-content: center; justify-items: start; gap: 30px; padding: 0 300px;
  }
  .row { display: flex; gap: 28px; align-items: center; }
  h1 { margin: 0; font-family: "Source Serif 4", Georgia, serif; font-size: 132px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  .tag { font: 700 70px/1 "Caveat", cursive; color: #c8312b; position: relative; }
  .tag svg { position: absolute; left: 0; bottom: -18px; width: 100%; height: 24px; overflow: visible; }
  .names { font-size: 34px; font-weight: 600; }
  .meta { font-size: 24px; color: #47575e; letter-spacing: .02em; }
  .fade { opacity: 0; }
</style>
</head>
<body>
  <div class="row fade" id="a">
    <svg width="120" height="120" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="12" fill="#15212a"/><path d="M14 22h36M14 32h36M14 42h36" stroke="#a9c2ae" stroke-width="2"/><path d="M12 36c2-14 34-18 40-8 5 9-14 18-30 15-9-2-11-8-6-14" fill="none" stroke="#ff6a5c" stroke-width="3.5" stroke-linecap="round"/></svg>
    <h1>Red Pen</h1>
  </div>
  <div class="tag fade" id="b">Every line, read.<svg viewBox="0 0 400 24" preserveAspectRatio="none"><path id="u" d="M4 14 C 120 6, 260 20, 396 8" fill="none" stroke="#c8312b" stroke-width="4" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg></div>
  <div class="names fade" id="c">David Shi · Srihari Kumaresan · Alex Du</div>
  <div class="meta fade" id="d">Iowa's 3rd District · Congressional App Challenge 2026</div>
  <script>
    const clamp = (x) => Math.min(1, Math.max(0, x));
    window.renderAt = (t) => {
      [["a", 0.1], ["b", 0.6], ["c", 1.3], ["d", 1.7]].forEach(([id, at]) => {
        const el = document.getElementById(id);
        const k = clamp((t - at) / 0.6);
        el.style.opacity = k;
        el.style.transform = `translateY(${(1 - k) * 10}px)`;
      });
      const u = document.getElementById("u");
      u.style.strokeDasharray = 420;
      u.style.strokeDashoffset = 420 * (1 - clamp((t - 1.0) / 0.7));
    };
    document.fonts.ready.then(() => { window.renderAt(0); window.cardReady = true; });
  </script>
</body>
</html>
